<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Music Subscription</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="brand">🎵 Music Subscription</h1>
      <h2>Sign In</h2>

      <div id="login-error" class="alert alert-error hidden"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">
          Login
        </button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("login-btn");
      const errorBox = document.getElementById("login-error");
      errorBox.classList.add("hidden");
      btn.textContent = "Signing in…";
      btn.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const result = await API.login(email, password);
        if (result.success) {
          sessionStorage.setItem("user_email", email);
          sessionStorage.setItem("user_name", result.user_name);
          window.location.href = "main.html";
        } else {
          showError(errorBox, result.message || "Email or password is incorrect.");
        }
      } catch (err) {
        showError(errorBox, "Could not reach the server. Please try again.");
      } finally {
        btn.textContent = "Login";
        btn.disabled = false;
      }
    });

    function showError(box, msg) {
      box.textContent = msg;
      box.classList.remove("hidden");
    }
  </script>
</body>
</html>
