<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Music Subscription</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="brand">🎵 Music Subscription</h1>
      <h2>Create Account</h2>

      <div id="register-error" class="alert alert-error hidden"></div>
      <div id="register-success" class="alert alert-success hidden"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="register-btn">
          Register
        </button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("register-btn");
      const errorBox = document.getElementById("register-error");
      const successBox = document.getElementById("register-success");
      errorBox.classList.add("hidden");
      successBox.classList.add("hidden");
      btn.textContent = "Registering…";
      btn.disabled = true;

      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        const result = await API.register(email, username, password);
        if (result.success) {
          successBox.textContent = "Registration successful! Redirecting to login…";
          successBox.classList.remove("hidden");
          setTimeout(() => window.location.href = "login.html", 1500);
        } else {
          errorBox.textContent = result.message || "Registration failed. Please try again.";
          errorBox.classList.remove("hidden");
        }
      } catch (err) {
        errorBox.textContent = "Could not reach the server. Please try again.";
        errorBox.classList.remove("hidden");
      } finally {
        btn.textContent = "Register";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
